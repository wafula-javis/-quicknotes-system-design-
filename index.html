!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes API Client</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes API Client</h1>
    <p>Load, add and delete notes through a REST API.</p>
  </header>
 
  <main>
    <section>
      <h2>Your notes</h2>
      <button type="button" id="load-btn">Load notes</button>
      <p id="status" role="status"></p>
    </section>
 
    <section>
      <h2>Add a note</h2>
      <form id="note-form">
        <label for="title-input">Title</label>
        <input type="text" id="title-input" name="title">
 
        <label for="body-input">Body</label>
        <textarea id="body-input" name="body" rows="4"></textarea>
 
        <button type="submit" id="submit-btn">Add note</button>
      </form>
    </section>
 
    <section>
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </main>
 
  <footer>
    <p>Data comes from the JSONPlaceholder test API.</p>
  </footer>
</body>
</html>
